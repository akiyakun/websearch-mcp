services:
  websearch-mcp:
    build: .
    image: websearch-mcwebsearch-mcpp:1.0.0-alpha.4
    container_name: websearch-mcp

    restart: unless-stopped

    ports:
      - "${MCP_PORT}:8000"

    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "gpt-5.6-luna"
      SERVER_IP: "${SERVER_IP}"
      MCP_PORT: "${MCP_PORT}"
      # すべて正の整数。0 は無制限ではなく設定エラーです。
      SEARCH_MAX_CALLS_PER_WINDOW: "${SEARCH_MAX_CALLS_PER_WINDOW:-3}"
      SEARCH_WINDOW_SECONDS: "${SEARCH_WINDOW_SECONDS:-600}"
      SEARCH_MAX_CALLS_PER_DAY: "${SEARCH_MAX_CALLS_PER_DAY:-20}"
      SEARCH_MAX_TOKENS_PER_DAY: "${SEARCH_MAX_TOKENS_PER_DAY:-200000}"
      SEARCH_TOKEN_RESERVATION: "${SEARCH_TOKEN_RESERVATION:-12000}"
      SEARCH_BUDGET_TIMEZONE: "${SEARCH_BUDGET_TIMEZONE:-Asia/Tokyo}"
      SEARCH_USAGE_DB: /data/usage.sqlite3

    volumes:
      - usage-data:/data

volumes:
  usage-data:
    name: websearch-mcp-usage
