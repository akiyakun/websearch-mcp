services:
  websearch-mcp:
    build: .
    image: websearch-mcp:1.0.0
    container_name: websearch-mcp
    restart: unless-stopped
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8101}:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      WEBSEARCH_MCP_TOKEN: "${WEBSEARCH_MCP_TOKEN:?Set WEBSEARCH_MCP_TOKEN in .env}"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      SERVER_IP: "${SERVER_IP:-127.0.0.1}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}"
      SEARCH_USAGE_DB: /data/usage.sqlite3
      SEARCH_MAX_OUTPUT_TOKENS: "${SEARCH_MAX_OUTPUT_TOKENS:-1200}"
      SEARCH_MAX_CALLS_PER_WINDOW: "${SEARCH_MAX_CALLS_PER_WINDOW:-50}"
      SEARCH_WINDOW_SECONDS: "${SEARCH_WINDOW_SECONDS:-60}"
      SEARCH_MAX_CALLS_PER_DAY: "${SEARCH_MAX_CALLS_PER_DAY:-500}"
      SEARCH_MAX_TOKENS_PER_DAY: "${SEARCH_MAX_TOKENS_PER_DAY:-500000}"
      SEARCH_TOKEN_RESERVATION: "${SEARCH_TOKEN_RESERVATION:-12000}"
      SEARCH_BUDGET_TIMEZONE: "${SEARCH_BUDGET_TIMEZONE:-Asia/Tokyo}"
    volumes:
      - usage-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
volumes:
  usage-data:
    # Keep the 1.0.0-alpha volume name so usage history survives the upgrade.
    name: websearch-mcp-usage
